<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Winnipeg Waste Collection Schedule</title>
    <link rel="stylesheet" href="styles.css" />
</head>
<body>
    <header>
        <h1>♻️ Winnipeg Collection Days</h1>
    </header>
    
    <main>
        <section class="search-container">
            <label for="addressInput">Enter your street or address:</label>
            <input type="text" id="addressInput" placeholder="e.g., 1733 Main St">
            <button id="searchBtn">Search</button>
            <button id="clearBtn">🗑️ Clear</button>
            <button id="saveBtn">⭐ Save</button>
            
            <p id="statusMessage"></p>
        </section>

        <div class="table-wrapper">
            <table id="resultsTable">
                <thead>
                    <tr>
                        <th>Address</th>
                        <th>Garbage Day</th>
                        <th>Recycling Day</th>
                        <th>Yard Waste</th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                </tbody>
            </table>
        </div>
    </main>
    <script src="script.js"></script>
</body>
</html>
